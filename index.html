<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halina Lukashenko</title>
<meta name="description" content="Halina Lukashenko, SQL developer in Aarhus, Denmark.">
<meta property="og:title" content="Halina Lukashenko">
<meta property="og:description" content="SQL developer in Aarhus, Denmark.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://halyna-projects.github.io/">
<script data-goatcounter="https://halyna-demo-dk-jobbot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root {
    --accent: #3b82f6;
    --accent2: #a855f7;
    --text: #e9eaf2;
    --muted: #9aa0b8;
    --bg: #060608;
    --border: #24242f;
    --surface: #121219;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg); overflow-x: hidden; position: relative;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; pointer-events: none; }
  .blob-1 { width: 420px; height: 420px; top: -180px; right: -120px; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); }
  .blob-2 { width: 320px; height: 320px; bottom: -160px; left: -100px; background: radial-gradient(circle, var(--accent2) 0%, transparent 70%); }
  .card {
    position: relative; width: 100%; max-width: 420px; text-align: center; padding: 40px 28px 34px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  }
  .card img { width: 132px; height: 132px; object-fit: cover; object-position: center top; border-radius: 50%; border: 3px solid var(--border); margin-bottom: 18px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; }
  .role { color: var(--accent); font-weight: 600; margin: 0 0 4px; }
  .nw { white-space: nowrap; }
  .place { color: var(--muted); margin: 0 0 26px; }
  .btn { display: inline-block; padding: 12px 26px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  .btn:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <main class="card">
    <img src="work/assets/halina.jpg" alt="Halina Lukashenko">
    <h1>Halina Lukashenko</h1>
    <p class="role">SQL Developer · Oracle · PL/SQL · <span class="nw">T-SQL</span></p>
    <p class="place">Aarhus, Denmark</p>
    <a class="btn" href="https://linkedin.com/in/halina-lukashenko">LinkedIn</a>
  </main>
</body>
</html>
